lifecycle_gate_requirements:
  L0-L5: Rehearse lead capture, founder pursue/decline, C1 facts/scope confirmation, founder proposal
    approval and client acceptance, signed contract/deposit/clearance, and founder/C1 plan, team, roles,
    access and inputs. No actual client, money or consent is fabricated.
  L6: Every offer stage gate logged; two consolidated feedback rounds per phase; scope additions use a
    simulated change decision.
  L7: Founder release approval; C1 final acceptance and separately receipt/access; opened handover pack.
  L8: Simulated warranty closure, care agreed or declined, access removed and credentials rotated; deferred
    field/device tests retain owners and dates.
  L9: Founder retro actions and publication gate; C1 case-study permission separately; closed project
    gate log. No real publication permission is implied.

status: proposed
protocol: Pilot Delivery Dry-Run
fictional_project: Stillsoil Atelier
score_scale:
- 1
- 5
index_scale:
- 0
- 100
ready_bar: 80
minimum_each_stage: 4
stage_aggregation: Arithmetic mean of applicable job rubric scores; case scores are weighted criterion
  means. No missing required rubric or stage may be omitted.
hard_gates:
- Every stage has actual evidence and a human-checked score; fictional Stillsoil case scores remain demo
  and cannot enter leaderboard evidence.
- No unresolved Blocker or Major and no disqualifiers.
- All required human gates are actually recorded, rehearsal-only.
- D-0023 lab/transfer/frame/fallback evidence passes; field p75 remains explicitly unverified until available.
- Complete opened delivery pack, rights, AI-final consent rehearsal, rollback and care/access-removal
  checks.

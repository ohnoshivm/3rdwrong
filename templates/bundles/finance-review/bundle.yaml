kind: finance-review
description: Private monthly finance review used in the monthly business review. Renders into the vault
  only; money metrics follow business/scorecard.md.
template: finance-review.md.tmpl
target: '{vault}/finance/reviews/{month}.md'
variables:
- name: month
  description: Month under review (YYYY-MM).
  example: 2026-10
- name: date
  description: Date of the review (YYYY-MM-DD).
  example: '2026-11-03'

# Taste Graph seed: public URLs and the studio's own notes only. No captured media or third-party text.
# Loaded by `uv run scripts/taste_graph.py init --seed`; existing entries are never overwritten.
# Sources: taste/swipe-file.md (tiers -> score/tags), taste/studio-websites.md, taste/award-site-teardowns.md,
# taste/discovery-sources.md, and the studio's own creative rules (principles and anti-patterns).
# Format: a YAML subset (flat mappings, quoted strings, flow lists) parsed without extra dependencies.
# Node keys other than type/slug/title/body/url/kind/verdict/score/tags are stored in props.
version: 1

nodes:
  # ---- Principles: what to do (studio rules)
  - type: principle
    title: "Type-led design"
    verdict: exemplar
    tags: [typography, hierarchy, identity]
    body: "Let typography carry identity and hierarchy before imagery or effects; choose and set type deliberately, never by default."
  - type: principle
    title: "Real hierarchy"
    verdict: exemplar
    tags: [hierarchy, layout, composition]
    body: "One clear first read per view, then a deliberate second and third; size, weight, space and position agree on what matters."
  - type: principle
    title: "Generous whitespace"
    verdict: exemplar
    tags: [spacing, layout, composition]
    body: "Treat space as a material: give the key idea room so it reads at a glance; crowding signals uncertainty."
  - type: principle
    title: "Intentional asymmetry"
    verdict: exemplar
    tags: [layout, composition, grid]
    body: "Break symmetry on purpose to create tension and direction, anchored to a grid so it reads as decided rather than misaligned."
  - type: principle
    title: "One idea per section"
    verdict: exemplar
    tags: [structure, copy, storytelling]
    body: "Each section makes one point; if it needs two headlines it is two sections."
  - type: principle
    title: "Fewer, stronger decisions"
    verdict: exemplar
    tags: [art-direction, identity, restraint]
    body: "Commit to a small number of distinctive choices and push them, rather than layering many safe ones."
  - type: principle
    title: "Motion with purpose"
    verdict: exemplar
    tags: [motion, interaction, accessibility]
    body: "Every animation aids hierarchy, storytelling or feedback, with precise easing and consistent durations; always honour prefers-reduced-motion."
  - type: principle
    title: "Performance parity with visual ambition"
    verdict: exemplar
    tags: [performance, engineering, accessibility]
    body: "The build must be as good as the look: fast first view, smooth frames and accessible fallbacks. Spectacle that stutters is a defect."
  - type: principle
    title: "A single coherent palette"
    verdict: exemplar
    tags: [colour, identity, restraint]
    body: "Define colour roles once and hold them everywhere; a palette earns recognition through consistency, not variety."

  # ---- Anti-patterns: what NOT to do (studio rules and repository cautions)
  - type: pattern
    title: "Generic SaaS template"
    verdict: anti_pattern
    tags: [layout, generic, landing-page]
    body: "Centred hero, decorative blob, three feature cards and a logo strip: interchangeable with any product and ownable by none."
  - type: pattern
    title: "Random gradient soup"
    verdict: anti_pattern
    tags: [colour, background, generic]
    body: "Gradients chosen for mood alone, unrelated to the palette or concept; they blur hierarchy and date quickly."
  - type: pattern
    title: "Gratuitous card grids and cards inside cards"
    verdict: anti_pattern
    tags: [layout, ui, generic]
    body: "Boxing every item flattens hierarchy; nested cards add borders and padding without adding meaning."
  - type: pattern
    title: "Weak default typography"
    verdict: anti_pattern
    tags: [typography, generic]
    body: "System or template defaults with no scale, no contrast of weight and no voice: the fastest way to look unconsidered."
  - type: pattern
    title: "Overdecorated backgrounds"
    verdict: anti_pattern
    tags: [background, decoration]
    body: "Textures, blobs and noise competing with content; decoration that does not carry the concept is clutter."
  - type: pattern
    title: "Decorative 3D unrelated to the concept"
    verdict: anti_pattern
    tags: [3d, decoration, performance]
    body: "Floating objects added for spectacle cost load time and attention without saying anything about the brand."
  - type: pattern
    title: "Animation for its own sake"
    verdict: anti_pattern
    tags: [motion, decoration]
    body: "Everything fades, slides and parallaxes; motion without a job dilutes the moments that matter and tires the reader."
  - type: pattern
    title: "Misaligned sections and inconsistent spacing"
    verdict: anti_pattern
    tags: [layout, spacing, craft]
    body: "Edges that almost line up and gaps that vary without reason read as carelessness, not as asymmetry."
  - type: pattern
    title: "Six-line headline wraps"
    verdict: anti_pattern
    tags: [typography, copy, responsive]
    body: "A headline that wraps into a tall column on small screens loses its shape; size and edit headlines per breakpoint."
  - type: pattern
    title: "Filler copy"
    verdict: anti_pattern
    tags: [copy, generic]
    body: "Placeholder or generic claims (\"we craft digital experiences\") that any studio could sign; every line should be specific."
  - type: pattern
    title: "Default awards-site vocabulary"
    verdict: anti_pattern
    tags: [art-direction, generic, website]
    source: "taste/studio-websites.md#what-not-to-take-from-them"
    body: "Loaders, immersive entry scenes, large type, pointer effects and dramatic transitions used by default converge on category sameness."
  - type: pattern
    title: "Spectacle over comprehension"
    verdict: anti_pattern
    tags: [performance, accessibility, 3d, motion]
    source: "taste/studio-websites.md#what-not-to-take-from-them"
    body: "Effects that trade load time, battery, comprehension or access for novelty; ask what the identity still says without sound, heavy rendering and transitions."
  - type: pattern
    title: "Rejected own-identity direction (D-0006)"
    verdict: anti_pattern
    tags: [identity, 3rdwrong, colour, typography]
    source: "studio/decisions/0006-rejected-own-identity-direction.md"
    body: "Black backgrounds, heavy grotesk type and neon accents were rejected as conventional for 3RDWRONG's own identity; do not reuse them as guidance."

